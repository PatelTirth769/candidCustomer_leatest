buildscript {
    ext.kotlin_version = '2.1.0'
    ext.agp_version = '8.5.2'

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        // Add the dependency for the Google services Gradle plugin
        classpath 'com.google.gms:google-services:4.4.2' // Updated version
        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2' // Updated version
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

subprojects {
    project.plugins.withId('com.android.library') {
        project.android {
            compileSdk 36
            if (namespace == null) {
                def ns = project.group.toString().replace(':', '.')
                if (!ns) {
                    ns = 'com.example.' + project.name.replace('-', '_')
                }
                namespace = ns
            }
        }
    }
    project.plugins.withId('com.android.application') {
        if (project.name != 'app') {
            project.android {
                compileSdk 36
                if (namespace == null) {
                    def ns = project.group.toString().replace(':', '.')
                    if (!ns) {
                        ns = 'com.example.' + project.name.replace('-', '_')
                    }
                    namespace = ns
                }
            }
        }
    }
}